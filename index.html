<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 · 동래구 기록 복구 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(12,18,30,.92);--line:rgba(150,215,255,.16);--mint:#3df5c4;--red:#ff3d5a;--amber:#ffb340;--sky:#66ccff;--ink:#eaf1ff;--sub:#8e9ab4;--mono:"Chakra Petch","Noto Sans KR",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;background:radial-gradient(ellipse at 50% -20%,#15283d,#070a10 60%) fixed #070a10}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.k{color:var(--mint);font:700 11px var(--mono);letter-spacing:.2em}
h1{margin:4px 0 0;font-size:24px;font-weight:900}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{padding:8px 14px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--mint)}.btn.pri{background:var(--mint);border-color:var(--mint);color:#032}.btn:disabled{opacity:.5;cursor:default}
.sm{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line)}
#login{max-width:380px;margin:12vh auto 0;padding:26px}
#login h2{margin:6px 0 16px;font-size:20px}
#login input{width:100%;margin-bottom:10px;padding:12px 14px;border:1px solid rgba(150,215,255,.3);background:#0b0f19;font-size:16px}
.msg{min-height:22px;margin-bottom:8px;color:var(--red);font-size:14px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.card{padding:14px 16px}.card b{display:block;font:700 28px/1.2 var(--mono)}.card span{color:var(--sub);font-size:13px}
.card.done b{color:var(--mint)}.card.run b{color:var(--sky)}.card.fail b{color:var(--red)}.card.chk b{color:var(--amber)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar input,.bar select{padding:8px 12px;border:1px solid var(--line);background:#0b0f19}.bar input{flex:1 1 200px}
.chip{padding:6px 12px;border:1px solid var(--line);background:none;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
.chip.on{border-color:var(--mint);color:var(--mint);background:rgba(61,245,196,.1)}
.tbl{overflow:auto;max-height:70vh}
table{width:100%;min-width:900px;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
th{position:sticky;top:0;z-index:1;background:#0e1626;color:var(--sub);font-size:12px}
tbody tr:hover{background:rgba(255,255,255,.03)}td.id{font-weight:700}td small{margin-left:6px;color:var(--sub)}
.st{display:inline-block;padding:2px 10px;border:1px solid;font-size:12px;font-weight:700}
.st.done{color:var(--mint);background:rgba(61,245,196,.1)}.st.run{color:var(--sky)}.st.fail{color:var(--red)}.st.stop{color:var(--sub)}
.pg{display:inline-block;width:70px;height:6px;margin-right:6px;vertical-align:middle;background:rgba(255,255,255,.1)}.pg i{display:block;height:100%;background:var(--mint)}
.flag{color:var(--amber);font-weight:700;cursor:help}
.del{padding:3px 10px;border:1px solid rgba(255,61,90,.5);background:none;color:var(--red);font-size:12px;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--sub)}
.note{margin-top:12px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><div class="k">DONGNAE CITY SYSTEM · ADMIN CONSOLE</div><h1>참가 기록 관리</h1></div>
 <div class="tools" id="tools" hidden>
  <span class="sm" id="upd"></span>
  <label class="sm"><input type="checkbox" id="auto"> 30초마다 자동 새로고침</label>
  <button class="btn" id="ref" type="button">새로고침</button>
  <button class="btn pri" id="csv" type="button">CSV 다운로드</button>
  <button class="btn" id="out" type="button">로그아웃</button>
 </div>
</header>
<form id="login" class="panel" autocomplete="off">
 <div class="k">ADMIN ACCESS</div><h2>관리자 비밀번호</h2>
 <input id="pw" type="password" placeholder="Apps Script에 설정한 비밀번호" aria-label="관리자 비밀번호">
 <div class="msg" id="lmsg" role="alert"></div>
 <button class="btn pri" type="submit" style="width:100%">접속</button>
</form>
<main id="app" hidden>
 <section class="cards" id="cards"></section>
 <div class="bar">
  <input id="q" type="search" placeholder="아이디 검색" aria-label="아이디 검색">
  <button class="chip" type="button" data-f="all"></button><button class="chip" type="button" data-f="done"></button><button class="chip" type="button" data-f="run"></button><button class="chip" type="button" data-f="fail"></button><button class="chip" type="button" data-f="stop"></button><button class="chip" type="button" data-f="chk"></button>
  <select id="sort" aria-label="정렬"><option value="last">최근 활동순</option><option value="done">완료 시각순</option><option value="prog">진행도순</option><option value="id">아이디순</option></select>
 </div>
 <div class="tbl panel"><table><thead><tr><th>아이디</th><th>상태</th><th>진행</th><th>시도</th><th>완료 시각</th><th>소요</th><th>오답</th><th>비고</th><th>최근 활동</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
 <p class="note">‘중단’은 진행 중에 50분 넘게 활동이 없는 참가자(창을 닫은 경우)예요. ‘확인 필요’는 5분 미만 완료처럼 비정상적인 기록이니 구글 시트의 ‘로그’ 탭에서 확인해 주세요.</p>
</main>
</div>
<script>
'use strict';
const SERVER_URL='https://script.google.com/a/macros/g.kmou.ac.kr/s/AKfycbzrh-W9T_82uOdn7gdiVMuJci9vp4ncWzoRWE2iXV1m9oniB0JMksqv15yeyRy0Cnw8Zg/exec';   // ★ 게임(PART 6)에 넣은 것과 같은 Apps Script 웹 앱 주소
const $=id=>document.getElementById(id),LABEL={done:'완료',run:'진행 중',fail:'실패',stop:'중단'};
let KEY='',ROWS=[],F='all',T=null,NOW=Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ts=v=>{if(!v)return 0;const t=new Date(v).getTime();return isNaN(t)?0:t};
const fd=v=>{const t=ts(v);return t?new Date(t).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'};
const state=x=>x.st==='완료'?'done':x.st==='실패'?'fail':NOW-ts(x.last)>50*60000?'stop':'run';
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k)||'';if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return ''}};
async function api(b){const r=await fetch(SERVER_URL,{method:'POST',body:JSON.stringify(Object.assign({key:KEY},b))});return r.json()}

async function login(k){KEY=k;$('lmsg').textContent='확인 중…';
 try{const j=await api({act:'list'});
  if(!j.ok){$('lmsg').textContent=j.err==='auth'?'비밀번호가 맞지 않아요.':'서버 오류 ('+j.err+')';KEY='';ss('dn-admin',null);return}
  ss('dn-admin',k);$('login').hidden=true;$('app').hidden=$('tools').hidden=false;take(j)}
 catch(e){$('lmsg').textContent='서버에 연결하지 못했어요. SERVER_URL과 배포 설정을 확인해 주세요.'}}
function take(j){ROWS=j.rows||[];NOW=ts(j.now)||Date.now();render();$('upd').textContent='갱신 '+new Date().toLocaleTimeString('ko-KR')}
async function load(){$('upd').textContent='불러오는 중…';
 try{const j=await api({act:'list'});if(!j.ok){if(j.err==='auth')return logout('비밀번호가 바뀌었어요. 다시 접속해 주세요.');throw 0}take(j)}
 catch(e){$('upd').textContent='⚠ 불러오기 실패'}}
function logout(m){KEY='';ss('dn-admin',null);clearInterval(T);T=null;$('auto').checked=false;$('app').hidden=$('tools').hidden=true;$('login').hidden=false;$('pw').value='';$('lmsg').textContent=m||''}

function render(){const q=$('q').value.trim().toLowerCase(),c={all:ROWS.length,done:0,run:0,fail:0,stop:0,chk:0};
 ROWS.forEach(x=>{c[state(x)]++;if(x.flag)c.chk++});
 const m=ROWS.filter(x=>x.st==='완료'&&+x.mins>0).map(x=>+x.mins),avg=m.length?(m.reduce((a,b)=>a+b,0)/m.length).toFixed(1)+'분':'-';
 $('cards').innerHTML=[['','전체 참가자',c.all],['done','완료',c.done],['run','진행 중',c.run],['fail','실패',c.fail],['','중단',c.stop],
  ['done','완료율',c.all?Math.round(c.done/c.all*100)+'%':'-'],['','평균 소요',avg],['chk','확인 필요',c.chk]]
  .map(k=>'<div class="card panel '+k[0]+'"><b>'+k[2]+'</b><span>'+k[1]+'</span></div>').join('');
 document.querySelectorAll('.chip').forEach(b=>{const f=b.dataset.f;b.classList.toggle('on',f===F);b.textContent=(f==='all'?'전체':f==='chk'?'확인 필요':LABEL[f])+' '+c[f]});
 const so=$('sort').value,list=ROWS.filter(x=>(F==='all'||(F==='chk'?!!x.flag:state(x)===F))&&(!q||String(x.id).toLowerCase().includes(q)));
 list.sort((a,b)=>so==='id'?String(a.id).localeCompare(String(b.id),'ko'):so==='done'?ts(b.doneAt)-ts(a.doneAt):so==='prog'?(+b.solved||0)-(+a.solved||0):ts(b.last)-ts(a.last));
 $('tb').innerHTML=list.length?list.map(x=>{const s=state(x),p=Math.min(20,+x.solved||0),d=x.st==='완료';
  return '<tr><td class="id">'+esc(x.id)+'</td><td><span class="st '+s+'">'+LABEL[s]+'</span></td>'+
   '<td><span class="pg"><i style="width:'+p*5+'%"></i></span>'+p+'/20<small>'+esc(x.zone)+'</small></td><td>'+(+x.n||0)+'회</td>'+
   '<td>'+(d?fd(x.doneAt):'-')+'</td><td>'+(d?esc(x.mins)+'분':'-')+'</td><td>'+(d?(+x.wrong||0)+'회':'-')+'</td>'+
   '<td>'+(x.flag?'<span class="flag" title="5분 미만 완료 또는 구역 기록 누락 — 시트의 로그 탭에서 확인">⚠ '+esc(x.flag)+'</span>':'')+'</td>'+
   '<td>'+fd(x.last)+'</td><td><button type="button" class="del" data-id="'+esc(x.id)+'">삭제</button></td></tr>'}).join('')
  :'<tr><td colspan="10" class="empty">'+(ROWS.length?'조건에 맞는 기록이 없어요.':'아직 참가 기록이 없어요.')+'</td></tr>'}

$('login').addEventListener('submit',e=>{e.preventDefault();const k=$('pw').value.trim();if(k)login(k)});
$('q').addEventListener('input',render);$('sort').addEventListener('change',render);
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{F=b.dataset.f;render()}));
$('ref').addEventListener('click',load);$('out').addEventListener('click',()=>logout());
$('auto').addEventListener('change',e=>{clearInterval(T);T=e.target.checked?setInterval(load,30000):null});
$('tb').addEventListener('click',async e=>{const b=e.target.closest('.del');if(!b)return;const id=b.dataset.id;
 if(!confirm('「'+id+'」 기록을 삭제할까요? 되돌릴 수 없어요.'))return;b.disabled=true;
 try{const j=await api({act:'del',id});if(!j.ok)throw 0;ROWS=ROWS.filter(x=>x.id!==id);render()}catch(err){alert('삭제하지 못했어요. 다시 시도해 주세요.');b.disabled=false}});
$('csv').addEventListener('click',()=>{const f=v=>{const t=ts(v);return t?new Date(t).toLocaleString('ko-KR'):''},q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const H=['아이디','상태','시도','진행(문제)','구역','최초 시작','완료 시각','실제 소요(분)','타이머 사용','남은 시간','오답','확인 필요','최근 활동'];
 const L=[H.map(q).join(',')].concat(ROWS.map(x=>[x.id,LABEL[state(x)],x.n,x.solved,x.zone,f(x.first),f(x.doneAt),x.mins,x.used,x.left,x.wrong,x.flag,f(x.last)].map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));   // 엑셀 한글 깨짐 방지
 a.download='참가기록_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});
if(!SERVER_URL){$('lmsg').textContent='admin.html의 SERVER_URL에 Apps Script 웹 앱 주소를 넣어 주세요.';$('login').querySelector('button').disabled=true}
else{const k=ss('dn-admin');if(k)login(k)}
</script>
</body>
</html>
